<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-itunes-app" content="app-id=6752113008, app-argument=https://nikolaiborisov.github.io/isolid/news/">
  <meta name="description" content="Challenge yourself with a programming quiz in iSOLID.">
  <meta name="theme-color" content="#0a1428">
  <title>Dev News · iSOLID</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at top right, #155b66, transparent 65%), #0a1428;
      color: #f5f8ff; font: 17px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 480px); padding: 40px 28px; border: 1px solid #ffffff25;
      border-radius: 28px; background: #101f34; box-shadow: 0 24px 80px #0004; text-align: center; }
    .brand { color: #79ead4; font-weight: 750; letter-spacing: .12em; }
    h1 { font-size: clamp(32px, 8vw, 44px); line-height: 1.15; margin: 24px 0; }
    p { color: #bdcadd; }
    a { display: block; padding: 14px 20px; border-radius: 14px; text-decoration: none;
      font-weight: 650; margin-top: 16px; color: #0a1428; background: #79ead4; }
    .secondary { background: transparent; color: #f5f8ff; border: 1px solid #ffffff50; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    #status { font-size: 14px; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">iSOLID</div>
    <h1>Read this story in iSOLID.</h1>
    <p>Developer news, useful updates, and practical learning.</p>
    <a id="open-app" href="isolid://news">Open iSOLID</a>
    <a class="secondary" href="https://apps.apple.com/app/id6752113008">Download on the App Store</a>
    <p id="status" role="status">Already installed? Tap Open iSOLID to open this article.</p>
    <noscript><p>Choose Open iSOLID if installed, or download it from the App Store.</p></noscript>
  </main>
  <!-- iOS opens associated installed apps through the HTTPS universal link.
       Browsers cannot reliably detect installation. Keep the explicit install
       fallback instead of redirecting installed users to the Store on a timer. -->
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if (id && !id.includes('/')) {
      document.getElementById('open-app').href = 'isolid://news?id=' + encodeURIComponent(id);
      document.querySelector('meta[name="apple-itunes-app"]').content =
        'app-id=6752113008, app-argument=' + location.href;
    } else {
      document.getElementById('open-app').href = 'isolid://profile';
    }
  </script>
</body>
</html>

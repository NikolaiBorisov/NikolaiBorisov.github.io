<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
  <title id="title">iOS Beginner Roadmap</title>
  <desc id="desc">A clean numbered roadmap for beginner iOS developers covering setup, Swift, SwiftUI, UIKit, playground practice, pet projects, portfolio, and AI tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090a0f"/>
      <stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d29"/>
      <stop offset="1" stop-color="#10141d"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { fill: #f5f5f7; font: 800 58px -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; }
      .subtitle { fill: rgba(245,245,247,0.66); font: 500 24px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .cardTitle { fill: #f5f5f7; font: 760 28px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .num { fill: #7dbbff; font: 800 28px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .body { fill: rgba(245,245,247,0.76); font: 520 21px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .noteLabel { fill: #7dbbff; font: 800 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; letter-spacing: 0.08em; }
      .noteBody { fill: rgba(245,245,247,0.74); font: 520 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; }
      .mutedLine { stroke: rgba(245,245,247,0.08); stroke-width: 1; }
      .cardStroke { stroke: rgba(245,245,247,0.13); stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1600" height="1500" fill="url(#bg)"/>
  <path class="mutedLine" d="M80 210H1520M80 1370H1520M800 245V1350"/>

  <text x="90" y="108" class="title">iOS Beginner Roadmap</text>
  <text x="92" y="154" class="subtitle">A practical path from first setup to a portfolio-ready pet project.</text>

  <g filter="url(#softShadow)">
    <rect x="90" y="245" width="680" height="250" rx="8" fill="url(#card)" class="cardStroke"/>
    <text x="122" y="297" class="num">1.</text>
    <text x="166" y="297" class="cardTitle">Setup (IDE)</text>
    <text x="122" y="340" class="body">• MacBook or Mac mini with Apple Silicon</text>
    <text x="122" y="372" class="body">• Xcode + iOS Simulator</text>
    <text x="122" y="404" class="body">• iPhone for real-device testing</text>
    <text x="122" y="436" class="body">• Git, GitHub, Postman, Figma</text>
    <text x="122" y="468" class="body">• Apple Developer account later</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="830" y="245" width="680" height="250" rx="8" fill="url(#card)" class="cardStroke"/>
    <text x="862" y="297" class="num">2.</text>
    <text x="906" y="297" class="cardTitle">Swift Core Theory</text>
    <text x="862" y="340" class="body">• Variables, constants, types, operators</text>
    <text x="862" y="372" class="body">• Optionals and safe unwrapping</text>
    <text x="862" y="404" class="body">• Structs, classes, enums, protocols</text>
    <text x="862" y="436" class="body">• Closures, generics, error handling</text>
    <text x="862" y="468" class="body">• async/await and concurrency basics</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="530" width="680" height="250" rx="8" fill="url(#card)" class="cardStroke"/>
    <text x="122" y="582" class="num">3.</text>
    <text x="166" y="582" class="cardTitle">SwiftUI Core Theory</text>
    <text x="122" y="625" class="body">• Views, modifiers, layout, stacks</text>
    <text x="122" y="657" class="body">• State, Binding, Observable patterns</text>
    <text x="122" y="689" class="body">• Navigation, sheets, alerts, forms</text>
    <text x="122" y="721" class="body">• Lists, reusable components, previews</text>
    <text x="122" y="753" class="body">• Accessibility and Dynamic Type</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="830" y="530" width="680" height="250" rx="8" fill="url(#card)" class="cardStroke"/>
    <text x="862" y="582" class="num">4.</text>
    <text x="906" y="582" class="cardTitle">UIKit Core Theory</text>
    <text x="862" y="625" class="body">• UIViewController lifecycle</text>
    <text x="862" y="657" class="body">• Auto Layout and constraints</text>
    <text x="862" y="689" class="body">• Table views and collection views</text>
    <text x="862" y="721" class="body">• Delegation, target-action, coordinators</text>
    <text x="862" y="753" class="body">• UIKit inside SwiftUI and legacy apps</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="815" width="680" height="250" rx="8" fill="url(#card)" class="cardStroke"/>
    <text x="122" y="867" class="num">5.</text>
    <text x="166" y="867" class="cardTitle">Playground Practice</text>
    <text x="122" y="910" class="body">• Solve small Swift logic tasks daily</text>
    <text x="122" y="942" class="body">• Practice arrays, dictionaries, sorting</text>
    <text x="122" y="974" class="body">• Decode JSON into models</text>
    <text x="122" y="1006" class="body">• Write tiny networking and async examples</text>
    <text x="122" y="1038" class="body">• Refactor code until it is easy to read</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="830" y="815" width="680" height="250" rx="8" fill="url(#card)" class="cardStroke"/>
    <text x="862" y="867" class="num">6.</text>
    <text x="906" y="867" class="cardTitle">Pet Project</text>
    <text x="862" y="910" class="body">• Pick one useful, small app idea</text>
    <text x="862" y="942" class="body">• Build launch, onboarding, auth, profile</text>
    <text x="862" y="974" class="body">• Add API flow, local storage, error states</text>
    <text x="862" y="1006" class="body">• Ship one feature every day</text>
    <text x="862" y="1038" class="body">• Polish UI, empty states, loading states</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="1100" width="680" height="250" rx="8" fill="url(#card)" class="cardStroke"/>
    <text x="122" y="1152" class="num">7.</text>
    <text x="166" y="1152" class="cardTitle">Portfolio</text>
    <text x="122" y="1195" class="body">• GitHub repo with clean commits</text>
    <text x="122" y="1227" class="body">• README with screenshots and architecture</text>
    <text x="122" y="1259" class="body">• GitHub.io personal portfolio website</text>
    <text x="122" y="1291" class="body">• Case study: problem, solution, tradeoffs</text>
    <text x="122" y="1323" class="body">• LinkedIn post explaining what you built</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="830" y="1100" width="680" height="250" rx="8" fill="url(#card)" class="cardStroke"/>
    <text x="862" y="1152" class="num">8.</text>
    <text x="906" y="1152" class="cardTitle">AI Tools</text>
    <text x="862" y="1195" class="body">• Use AI to explain errors and concepts</text>
    <text x="862" y="1227" class="body">• Ask for code review, not blind generation</text>
    <text x="862" y="1259" class="body">• Compare solutions and ask why they work</text>
    <text x="862" y="1291" class="body">• Verify answers with Apple documentation</text>
    <text x="862" y="1323" class="body">• Keep code you can read and explain</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="90" y="1385" width="1420" height="84" rx="8" fill="rgba(10,132,255,0.12)" stroke="rgba(10,132,255,0.32)" stroke-width="1.2"/>
    <text x="122" y="1425" class="noteLabel">DAILY RULE</text>
    <text x="282" y="1425" class="noteBody">Swift → SwiftUI → UIKit → pet project. One small feature at a time.</text>
    <text x="282" y="1457" class="noteBody">Build it, debug it, explain it, then move to the next feature.</text>
  </g>
</svg>
